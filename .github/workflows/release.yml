name: Release

# Publish a GitHub Release with all installers, either by
#  - pushing a tag like "v0.2.0", or
#  - running this workflow manually (Actions → Release → Run workflow) with a version like
#    "0.2.0"; the tag "v0.2.0" is then created on the selected commit.
# Versions with a suffix (e.g. "0.2.0-beta.1") are published as pre-releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading "v" (e.g. 0.2.0)'
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid version (expected e.g. 0.2.0 or 0.2.0-beta.1)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  installers:
    needs: version
    uses: ./.github/workflows/build-installers.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 3

  release:
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Zero-K Map Creator ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows 10/11 | `Zero-K-Map-Creator-*-windows-setup.exe` |
            | macOS (Apple Silicon) | `Zero-K-Map-Creator-*-macos-arm64.dmg` |
            | macOS (Intel) | `Zero-K-Map-Creator-*-macos-x64.dmg` |
            | Linux | `Zero-K-Map-Creator-*-linux-x86_64.AppImage` or `.deb` |

            > **macOS builds are untested** — the maintainer has no Mac. Feedback via GitHub issues is very welcome.

            The installers are not code-signed yet:
            - **Windows:** SmartScreen may warn about an unknown publisher → *More info* → *Run anyway*.
            - **macOS:** after copying the app to *Applications*, run once in Terminal:
              `xattr -cr "/Applications/Zero-K Map Creator.app"`
            - **Linux (AppImage):** `chmod +x Zero-K-Map-Creator-*.AppImage` and run it.
