name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck app
        run: pnpm --filter @zk-map/desktop typecheck

      - name: Typecheck packages
        run: pnpm --filter @zk-map/smf-format --filter @zk-map/map-lua --filter @zk-map/zk-locator typecheck

      - name: Unit tests
        run: pnpm -r test

  installers:
    name: Installers
    needs: test
    uses: ./.github/workflows/build-installers.yml
