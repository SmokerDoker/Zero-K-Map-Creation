name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @zk-map/desktop typecheck

      - name: Typecheck packages
        run: pnpm --filter @zk-map/smf-format --filter @zk-map/map-lua --filter @zk-map/zk-locator typecheck

      - name: Unit tests
        run: pnpm -r test
