appId: org.zerokmapcreator.app
productName: Zero-K Map Creator
# The workspace package is called "@zk-map/desktop"; give the shipped app a clean name instead
# (used for the Linux executable and the .deb package name).
extraMetadata:
  name: zero-k-map-creator
directories:
  output: release
  buildResources: build

# electron-vite's build output — everything the packaged app needs to run. All JS dependencies are
# bundled into out/ by electron-vite; the only runtime node_module is 7zip-bin (see package.json).
files:
  - out/**/*
  - package.json

asarUnpack:
  # 7za binaries must stay on disk (unpacked) — they're spawned as a separate process and can't
  # be executed straight out of an asar archive.
  - '**/node_modules/7zip-bin/**/*'

afterPack: scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: 'Zero-K-Map-Creator-${version}-windows-setup.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # No Apple Developer ID yet: skip Developer-ID signing; scripts/after-pack.cjs signs ad-hoc instead.
  identity: null
  artifactName: 'Zero-K-Map-Creator-${version}-macos-${arch}.${ext}'

dmg:
  artifactName: 'Zero-K-Map-Creator-${version}-macos-${arch}.${ext}'

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  executableName: zero-k-map-creator
  maintainer: SmokerDoker
  artifactName: 'Zero-K-Map-Creator-${version}-linux-${arch}.${ext}'

# No auto-update/publish via electron-builder — GitHub Actions uploads the installers itself.
publish: null
